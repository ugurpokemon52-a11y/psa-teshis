name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Protokol testleri
        run: node test/run.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk PsaTeshis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PsaTeshis-apk
          path: PsaTeshis.apk

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: PSA Teşhis v1.${{ github.run_number }}
          body: Otomatik derlenen APK. Telefona indirip kur.
          files: PsaTeshis.apk
