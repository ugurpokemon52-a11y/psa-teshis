plugins {
    id 'com.android.application'
}

android {
    namespace 'com.huseyin.psateshis'
    compileSdk 34

    defaultConfig {
        applicationId 'com.huseyin.psateshis'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1." + (System.getenv('VERSION_CODE') ?: '0')
    }

    signingConfigs {
        release {
            storeFile file('psateshis.jks')
            storePassword 'psateshis2026'
            keyAlias 'psateshis'
            keyPassword 'psateshis2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
